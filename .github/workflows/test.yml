name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            rails: "~> 7.1.0"
          - ruby: "3.2"
            rails: "~> 7.2.0"
          - ruby: "3.3"
            rails: "~> 8.0.0"

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_WITHOUT: ""

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Separate cache per Rails pin (Gemfile.lock alone isn't enough with RAILS_VERSION)
          cache-version: rails-${{ matrix.rails }}
      - name: Install gems for Rails ${{ matrix.rails }}
        run: |
          rm -f Gemfile.lock
          bundle lock
          bundle install --jobs 4
      - name: Run tests
        run: bundle exec rake test
